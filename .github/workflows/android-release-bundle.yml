name: Android release bundle (unsigned validation)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cloud-auth.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/android-release-bundle.yml'
      - 'icons/**'
      - 'privacy.html'
      - 'terms.html'
      - 'delete-account.html'

permissions:
  contents: read

jobs:
  build-unsigned-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript and calculations
        run: |
          npm run check:syntax
          npm test
      - name: Build web assets
        run: npm run build:web
      - name: Generate and configure Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-native.mjs android
      - name: Verify Android application ID
        run: |
          grep -q '"appId": "au.com.truckingcostr.app"' capacitor.config.json
          grep -q 'applicationId "au.com.truckingcostr.app"' android/app/build.gradle || grep -q "applicationId 'au.com.truckingcostr.app'" android/app/build.gradle
      - name: Assemble release bundle (unsigned)
        run: cd android && ./gradlew bundleRelease
      - name: Upload unsigned AAB for engineering validation
        uses: actions/upload-artifact@v4
        with:
          name: truckingcostr-android-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

# This bundle is NOT signed and must NOT be uploaded to Play Console.
# Production signing must use the owner's protected upload key and a separately
# reviewed signing process. Never commit keystores or passwords.
