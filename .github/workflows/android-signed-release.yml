name: Android signed release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_B64" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS"; do
            if [ -z "$value" ]; then echo "::error::Missing Android signing secret"; exit 1; fi
          done
      - name: Install dependencies and test
        run: |
          npm ci --no-audit --no-fund
          npm run check:syntax
          npm test
          npm run build:web
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-native.mjs android
      - name: Configure signing (secrets never committed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          node scripts/configure-android-signing.mjs
          {
            echo "TRUCKING_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-key.jks"
            echo "TRUCKING_UPLOAD_STORE_PASSWORD=$STORE_PASS"
            echo "TRUCKING_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "TRUCKING_UPLOAD_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
      - name: Build signed AAB
        run: cd android && ./gradlew --no-daemon bundleRelease
      - name: Verify AAB signing
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$AAB"
          jarsigner -verify "$AAB"
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: truckingcostr-android-signed-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
