<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>TruckCost AU</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0c1014;--panel:#151b21;--panel2:#1b232b;--text:#f2f5f7;--muted:#9aa6b2;--line:#2a343e;--accent:#ffb000;--good:#42d392;--bad:#ff6b6b;--r:16px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0f13,#11171d);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px}.top{position:sticky;top:0;z-index:5;background:rgba(12,16,20,.94);backdrop-filter:blur(12px);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand span{color:var(--accent)}.status{font-size:11px;color:var(--accent);border:1px solid #6b5010;padding:5px 8px;border-radius:99px}.page{padding:16px}.hero{padding:20px 0 10px}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px}.hero h1{font-size:30px;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}.metric{font-size:29px;font-weight:900;margin:5px 0}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#111;font-weight:850}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.good{background:var(--good)}.btn.danger{background:#3a2022;color:#ff9b9b;border:1px solid #653337}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-title{font-weight:900;font-size:17px;margin:18px 0 9px}.item{padding:12px 0;border-top:1px solid var(--line)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:11px}.good{color:var(--good)}.bad{color:var(--bad)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#10161b;border-top:1px solid var(--line);z-index:9}.nav button{background:none;border:0;color:var(--muted);padding:10px 3px;font-size:11px}.nav button.active{color:var(--accent)}.nav b{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(520px,100%);margin:auto 0 0;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:18px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;background:#0f1419;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.close{background:none;border:0;color:var(--muted);font-size:24px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:#e9eef2;color:#101418;padding:11px 15px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bar{height:9px;background:#263039;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px}.logo{font-size:27px;font-weight:950;margin-bottom:18px}.logo span{color:var(--accent)}.hidden{display:none!important}.tableline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
</style>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="logo">TruckCost <span>AU</span></div><div class="eyebrow">Know what your truck really costs.</div><h2>Local beta</h2><p class="muted">This release stores data only in this browser. There is no real account, cloud sync or secure authentication yet.</p><div class="field"><label>Operator email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><button class="btn" style="width:100%" onclick="startLocal()">Enter local workspace</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="createDemo()">Load demo workspace</button><p class="small muted" style="margin-top:15px">Do not use this local beta as the system of record for confidential business data.</p></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">TruckCost <span>AU</span></div><div class="status">● LOCAL BETA</div></header><main id="content" class="page"></main><nav class="nav"><button data-tab="home" onclick="go('home')"><b>⌂</b>Dashboard</button><button data-tab="jobs" onclick="go('jobs')"><b>▣</b>Jobs</button><button data-tab="expenses" onclick="go('expenses')"><b>＋</b>Costs</button><button data-tab="vehicles" onclick="go('vehicles')"><b>🚛</b>Trucks</button><button data-tab="more" onclick="go('more')"><b>☰</b>More</button></nav></div>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h2 id="modalTitle" style="margin:0">Add</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='truckcost_au_v1';
const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Number.isFinite(Number(n))?Number(n):0);
const num=n=>{const v=Number(n);return Number.isFinite(v)?v:0};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));
const id=()=>Date.now()+Math.floor(Math.random()*1000);
function emptyState(){return{schemaVersion:1,user:null,vehicles:[],jobs:[],expenses:[],maintenance:[],trips:[],diaryEntries:[],activeTrip:null}}
function demoState(){return{schemaVersion:1,user:{email:'demo@truckcost.au',name:'Demo Operator'},vehicles:[{id:1,name:'Workhorse',make:'Kenworth',model:'T610',year:2016,rego:'123-ABC',odo:684200,initialOdo:640000,fuelKmL:2.45,fuelPrice:2.15,finance:2100,insurance:420,regoCost:180}],jobs:[{id:1,vehicleId:1,name:'Brisbane → Mackay',date:today(),revenue:4800,distance:1420,fuel:2.4,fuelPrice:2.15,tolls:145,driver:620,other:0}],expenses:[{id:1,vehicleId:1,date:today(),category:'Tyres',amount:1850,odo:682100,description:'Drive tyres'}],maintenance:[{id:1,vehicleId:1,date:today(),category:'Service',amount:980,odo:680000,next:690000,description:'Engine service'}],trips:[],diaryEntries:[],activeTrip:null}}
function normalise(s){if(!s||typeof s!=='object')return emptyState();return Object.assign(emptyState(),s,{schemaVersion:1,vehicles:Array.isArray(s.vehicles)?s.vehicles:[],jobs:Array.isArray(s.jobs)?s.jobs:[],expenses:Array.isArray(s.expenses)?s.expenses:[],maintenance:Array.isArray(s.maintenance)?s.maintenance:[],trips:Array.isArray(s.trips)?s.trips:[],diaryEntries:Array.isArray(s.diaryEntries)?s.diaryEntries:[],activeTrip:s.activeTrip&&typeof s.activeTrip==='object'?s.activeTrip:null})}
let state=normalise(JSON.parse(localStorage.getItem(KEY)||'null'));let tab='home';let gpsWatchId=null;let gpsLastPoint=null;let gpsStatus='Stopped';if(state.activeTrip){state.activeTrip.status='paused';state.activeTrip.pausedAt=new Date().toISOString();gpsStatus='Paused — reopen Trip Recorder to resume';save()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function startLocal(){const email=document.getElementById('email').value.trim();state.user={email:email||'Local operator',name:'Local Operator'};save();showApp();toast('Local workspace ready')}
function createDemo(){state=demoState();save();showApp();toast('Demo workspace loaded')}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');go('home')}
function boot(){if(state.user)showApp()}boot();
function veh(x){return state.vehicles.find(v=>v.id==x)}
function recordedKm(v){return Math.max(0,num(v.odo)-num(v.initialOdo))}
function annualFixed(v){return num(v.finance)*12+num(v.insurance)*12+num(v.regoCost)}
function fuelIntervalStats(v){if(!v)return{intervals:[],km:0,litres:0,cost:0,lPer100:0,kmPerL:0,costPerKm:0};const fills=state.expenses.filter(e=>e.vehicleId==v.id&&e.category==='Fuel'&&num(e.odo)>0&&num(e.litres)>0).sort((a,b)=>num(a.odo)-num(b.odo)||String(a.date).localeCompare(String(b.date)));const full=fills.filter(e=>e.fullTank===true),intervals=[];for(let i=1;i<full.length;i++){const prev=full[i-1],curr=full[i],km=num(curr.odo)-num(prev.odo);if(km<=0)continue;const included=fills.filter(e=>num(e.odo)>num(prev.odo)&&num(e.odo)<=num(curr.odo));const litres=included.reduce((a,e)=>a+num(e.litres),0),cost=included.reduce((a,e)=>a+num(e.amount),0);if(litres>0)intervals.push({from:num(prev.odo),to:num(curr.odo),km,litres,cost,lPer100:litres/km*100,kmPerL:km/litres,costPerKm:cost/km,fromDate:prev.date,toDate:curr.date})}const km=intervals.reduce((a,x)=>a+x.km,0),litres=intervals.reduce((a,x)=>a+x.litres,0),cost=intervals.reduce((a,x)=>a+x.cost,0);return{intervals,km,litres,cost,lPer100:km?litres/km*100:0,kmPerL:litres?km/litres:0,costPerKm:km?cost/km:0}}\nfunction fuelEfficiencyAlert(v){const intervals=fuelIntervalStats(v).intervals;if(intervals.length<4)return{status:'insufficient',text:'Build 4 measured intervals for trend alerts'};const recent=intervals[intervals.length-1],baseline=intervals.slice(-4,-1).reduce((a,x)=>a+x.lPer100,0)/3;const change=baseline>0?(recent.lPer100/baseline-1)*100:0;return{status:change>=15?'high':change<=-10?'improved':'normal',baseline,recent:recent.lPer100,change,text:change>=15?'Fuel use is more than 15% above recent average':change<=-10?'Fuel efficiency has improved against recent average':'Fuel use is within normal trend'}}
function vehicleCostPerKm(v){if(!v)return 0;const km=Math.max(1,recordedKm(v));const direct=state.expenses.filter(e=>e.vehicleId==v.id).reduce((a,e)=>a+num(e.amount),0)+state.maintenance.filter(e=>e.vehicleId==v.id).reduce((a,e)=>a+num(e.amount),0);return (direct+annualFixed(v))/km}
function vehicleNonFuelCostPerKm(v){if(!v)return 0;const km=Math.max(1,recordedKm(v));const expenses=state.expenses.filter(e=>e.vehicleId==v.id&&e.category!=='Fuel').reduce((a,e)=>a+num(e.amount),0),maint=state.maintenance.filter(e=>e.vehicleId==v.id).reduce((a,e)=>a+num(e.amount),0);return(expenses+maint)/km}
function jobCostBreakdown(j){const v=veh(j.vehicleId),fuelStats=fuelIntervalStats(v),fuel=fuelStats.km?fuelStats.costPerKm*num(j.distance):jobFuel(j),overhead=vehicleNonFuelCostPerKm(v)*num(j.distance),direct=fuel+num(j.tolls)+num(j.driver)+num(j.other),total=direct+overhead;return{fuel,overhead,direct,total,profit:num(j.revenue)-total,margin:(num(j.revenue)-total)/Math.max(1,num(j.revenue))*100,rate:total/Math.max(1,num(j.distance)),fuelSource:fuelStats.km?'measured fuel cost/km':'estimated fuel economy and price'}}
function minimumJobRevenue(cost,marginPercent){const margin=Math.min(90,Math.max(0,num(marginPercent)))/100;return Math.max(0,num(cost))/(1-margin)}
function jobFuel(j){return num(j.distance)/Math.max(.1,num(j.fuel))*num(j.fuelPrice)}
function jobProfit(j){return num(j.revenue)-jobFuel(j)-num(j.tolls)-num(j.driver)-num(j.other)}
function render(){const c=document.getElementById('content');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home:dashboard,jobs:jobsPage,expenses:expensesPage,vehicles:vehiclesPage,more:morePage}[tab])(c)}
function go(t){tab=t;render()}
function dashboard(c){const revenue=state.jobs.reduce((a,j)=>a+num(j.revenue),0);const direct=state.expenses.reduce((a,e)=>a+num(e.amount),0)+state.maintenance.reduce((a,e)=>a+num(e.amount),0);const jobFuel=state.jobs.reduce((a,j)=>a+jobFuelCost(j),0);const km=state.vehicles.reduce((a,v)=>a+recordedKm(v),0);const fixed=state.vehicles.reduce((a,v)=>a+annualFixed(v),0);const cost=(direct+jobFuel+fixed)/Math.max(1,km);const position=revenue-direct-jobFuel-fixed;c.innerHTML=`<div class="hero"><div class="eyebrow">${esc(state.user?.email||'Local operator')}</div><h1>Good morning.</h1><p class="muted">Fleet economics at a glance.</p></div><div class="grid"><div class="card"><div class="small muted">Estimated full cost / km</div><div class="metric">${money(cost)}</div><div class="small muted">Includes recorded fixed costs</div></div><div class="card"><div class="small muted">Job revenue</div><div class="metric">${money(revenue)}</div><div class="small good">${state.jobs.length} jobs</div></div></div><div class="card"><div class="row"><b>Estimated operating position</b><span class="pill">BETA</span></div><div class="tableline"><span>Fuel from jobs</span><b>${money(jobFuel)}</b></div><div class="tableline"><span>Recorded direct costs</span><b>${money(direct)}</b></div><div class="tableline"><span>Annual fixed costs allocated</span><b>${money(fixed)}</b></div><div class="tableline"><span>Revenue less listed costs</span><b class="${position>=0?'good':'bad'}">${money(position)}</b></div></div><div class="section-title">Quick actions</div><div class="actions"><button class="btn" onclick="jobModal()">＋ New Job</button><button class="btn secondary" onclick="expenseModal()">＋ Expense</button><button class="btn secondary" onclick="fuelModal()">⛽ Fuel</button><button class="btn secondary" onclick="maintenanceModal()">🔧 Maintenance</button><button class="btn secondary" onclick="vehicleModal()">🚛 Add Truck</button></div><div class="section-title">Maintenance watch</div>${maintenanceAlertsHtml()}<div class="section-title">Fleet</div>${state.vehicles.length?state.vehicles.map(v=>`<div class="card"><div class="row"><div><b>${esc(v.name)}</b><div class="small muted">${esc(v.make)} ${esc(v.model)} · ${esc(v.rego||'No rego')}</div></div><b>${money(vehicleCostPerKm(v))}/km</b></div><div class="bar"><i style="width:${Math.min(100,Math.max(8,vehicleCostPerKm(v)*100))}%"></i></div></div>`).join(''):'<p class="muted">Add your first truck to begin.</p>'}`}
function jobFuelCost(j){return jobFuel(j)}
function jobsPage(c){c.innerHTML=`<div class="hero"><div class="eyebrow">Profitability</div><h1>Jobs</h1><p class="muted">Estimated direct job costs plus allocated truck operating costs. Actual fuel interval data is used when available.</p></div><button class="btn" onclick="jobModal()">＋ Calculate new job</button><div class="section-title">Saved jobs</div>${state.jobs.length?state.jobs.slice().reverse().map(j=>{const b=jobCostBreakdown(j),p=b.profit,m=b.margin;return `<div class="card"><div class="row"><div><b>${esc(j.name)}</b><div class="small muted">${esc(j.date)} · ${num(j.distance).toLocaleString()} km</div></div><b class="${p>=0?'good':'bad'}">${money(p)}</b></div><div class="small muted" style="margin-top:7px">True-cost estimate · Margin ${m.toFixed(1)}% · Total cost ${money(b.total)} · ${money(b.rate)}/km</div><div class="small muted">Fuel: ${money(b.fuel)} (${esc(b.fuelSource)}) · Truck overhead allocation: ${money(b.overhead)}</div></div>`}).join(''):'<p class="muted">No jobs yet.</p>'}`}
function expensesPage(c){const cats={};state.expenses.forEach(e=>cats[e.category]=(cats[e.category]||0)+num(e.amount));state.maintenance.forEach(e=>cats['Maintenance']=(cats['Maintenance']||0)+num(e.amount));c.innerHTML=`<div class="hero"><div class="eyebrow">Costs</div><h1>Expenses</h1><p class="muted">Record every direct operating cost.</p></div><div class="actions"><button class="btn" onclick="expenseModal()">＋ Expense</button><button class="btn secondary" onclick="fuelModal()">⛽ Fuel</button><button class="btn secondary" onclick="maintenanceModal()">🔧 Maintenance</button><button class="btn secondary" onclick="receiptModal()">📷 Receipt</button></div><div class="section-title">Breakdown</div>${Object.keys(cats).length?Object.entries(cats).map(([k,v])=>`<div class="card"><div class="row"><span>${esc(k)}</span><b>${money(v)}</b></div></div>`).join(''):'<p class="muted">No expenses yet.</p>'}<div class="section-title">Recent expenses</div>${state.expenses.slice().reverse().map(e=>`<div class="item"><div class="row"><div><b>${esc(e.category)}</b><div class="small muted">${esc(veh(e.vehicleId)?.name||'')} · ${esc(e.date)}</div></div><b>${money(e.amount)}</b></div><div class="small muted">${esc(e.description||'')}</div></div>`).join('')}`}
function vehiclesPage(c){c.innerHTML=`<div class="hero"><div class="eyebrow">Fleet</div><h1>Your trucks</h1><p class="muted">Vehicle-specific economics and records.</p></div><button class="btn" onclick="vehicleModal()">＋ Add vehicle</button><div class="section-title">Vehicles</div>${state.vehicles.length?state.vehicles.map(v=>`<div class="card"><div class="row"><div><b>${esc(v.name)}</b><div class="small muted">${esc(v.year||'')} ${esc(v.make)} ${esc(v.model)}</div><div class="small muted">${esc(v.rego||'Unregistered')} · Odo ${recordedKm(v).toLocaleString()} km recorded</div></div><b>${money(vehicleCostPerKm(v))}/km</b></div><div class="tableline"><span>Measured fuel use</span><b>${fuelIntervalStats(v).km?fuelIntervalStats(v).lPer100.toFixed(1)+' L/100 km':'Need two full-tank odometer readings'}</b></div><div class="tableline"><span>Fuel cost / km (measured intervals)</span><b>${fuelIntervalStats(v).km?money(fuelIntervalStats(v).costPerKm)+'/km':'—'}</b></div><div class="tableline"><span>Fuel interval distance</span><b>${fuelIntervalStats(v).km.toLocaleString()} km</b></div><div class="tableline"><span>Fuel trend alert</span><b class="${fuelEfficiencyAlert(v).status==='high'?'bad':fuelEfficiencyAlert(v).status==='improved'?'good':''}">${esc(fuelEfficiencyAlert(v).text)}${fuelEfficiencyAlert(v).status==='high'?' ('+fuelEfficiencyAlert(v).change.toFixed(0)+'%)':''}</b></div><div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="vehicleModal(${v.id})">Edit</button><button class="btn secondary" onclick="fuelModal(${v.id})">Add fuel</button></div></div>`).join(''):'<p class="muted">No vehicles yet.</p>'}`}
function morePage(c){c.innerHTML=`<div class="hero"><div class="eyebrow">Account & data</div><h1>More</h1><p class="muted">${esc(state.user?.email||'')}</p></div><div class="card"><b>Local beta status</b><p class="muted">Data is stored in this browser only. This build deliberately does not pretend to provide cloud authentication or synchronisation.</p><span class="pill">LOCAL ONLY</span></div><div class="section-title">Backups</div><div class="actions"><button class="btn secondary" onclick="exportData()">Export backup</button><button class="btn secondary" onclick="document.getElementById('import').click()">Restore backup</button><button class="btn danger" onclick="resetData()">Reset data</button></div><input id="import" type="file" accept="application/json" class="hidden" onchange="importData(event)"><div class="section-title">Trip recorder</div><div class="card"><div class="row"><b>GPS trip recorder</b><span class="pill" id="gpsStatus">Stopped</span></div><p class="small muted">Records GPS location, GPS speed, route and distance while this app remains active. Requires location permission and HTTPS. Phone operating systems may suspend tracking when the screen is locked or the app is backgrounded; this beta is not continuous fleet telematics.</p><div class="field"><label>Truck for this trip</label><select id="tripVehicle"></select></div><div id="tripLive" class="tableline"><span>Current trip</span><b>Not recording</b></div><div class="actions"><button class="btn" onclick="startTrip()">Start trip</button><button class="btn secondary" onclick="resumeTrip()">Resume paused trip</button><button class="btn secondary" onclick="stopTrip()">Finish trip</button></div><div id="tripHistory" class="small muted" style="margin-top:12px"></div><button class="btn secondary" onclick="exportTripsCsv()">Export trip GPS CSV</button></div><div class="section-title">Driver work diary</div><div class="card"><div class="row"><b>Work & rest records</b><span class="pill">Manual log</span></div><p class="small muted">Personal work/rest log only. This beta is not an NHVR-approved Electronic Work Diary, does not calculate legal fatigue limits and does not replace a required written diary, approved EWD or local-area record. Drivers may need a work diary for 100+ km standard-hours work and for other approved hours options. Check the current NHVR requirements before relying on any record.</p><p class="small"><a href="https://www.nhvr.gov.au/safety-accreditation-compliance/fatigue-management/record-keeping-requirements" target="_blank" rel="noopener">NHVR record-keeping requirements</a> · <a href="https://www.nhvr.gov.au/safety-accreditation-compliance/fatigue-management/electronic-work-diary-ewd/ewd-register" target="_blank" rel="noopener">NHVR register of approved EWD providers</a></p><div class="actions"><button class="btn" onclick="diaryModal()">＋ Add diary entry</button><button class="btn secondary" onclick="exportDiaryCsv()">Export diary CSV</button></div><div id="diarySummary" style="margin-top:12px"></div><div id="diaryHistory"></div></div><div class="section-title">Financial reports</div><div class="card"><b>Choose reporting period</b><div class="actions" style="margin:10px 0"><button class="btn secondary" onclick="setReportPeriod('week')">This week</button><button class="btn secondary" onclick="setReportPeriod('month')">This month</button><button class="btn secondary" onclick="setReportPeriod('quarter')">This quarter</button><button class="btn secondary" onclick="setReportPeriod('year')">This year</button></div><div class="two"><div class="field"><label>From</label><input id="reportFrom" type="date" onchange="renderReport()"></div><div class="field"><label>To</label><input id="reportTo" type="date" onchange="renderReport()"></div></div><div class="field"><label>Truck</label><select id="reportVehicle" onchange="renderReport()"><option value="all">All trucks</option></select></div><button class="btn" onclick="renderReport()">Run report</button> <button class="btn secondary" onclick="exportReportCsv()">Export CSV</button></div><div id="reportOutput"></div><div class="section-title">Receipt workflow</div><div class="card"><p class="muted">Receipt capture is a review workflow only. No OCR service is connected in this release.</p><button class="btn secondary" onclick="receiptModal()">Open receipt capture</button></div><div class="section-title">Production blockers</div><div class="card"><div class="item">🔐 Real authentication and server-side authorisation</div><div class="item">☁️ Secure cloud database and multi-device sync</div><div class="item">🧪 Automated calculation tests and CI</div><div class="item">🧾 Verified OCR/accounting integration</div><div class="item">👥 Roles, audit logs and business-data controls</div></div><button class="btn secondary" onclick="signOut()">Sign out</button>`;setReportPeriod('month');renderTripDiary()}
function haversineKm(a,b){const rad=x=>x*Math.PI/180,R=6371,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function startTrip(){if(!state.vehicles.length){toast('Add a truck first');return}if(!navigator.geolocation){toast('GPS is not available in this browser');return}if(!window.isSecureContext){toast('GPS requires a secure HTTPS connection');return}if(state.activeTrip){toast('A trip is already active or paused');return}const v=veh(num(document.getElementById('tripVehicle')?.value)||state.vehicles[0].id);state.activeTrip={id:id(),vehicleId:v.id,startTime:new Date().toISOString(),startLocation:null,endTime:null,distanceKm:0,maxSpeedKmh:0,points:[],status:'recording'};gpsLastPoint=null;gpsStatus='Requesting GPS';save();renderTripDiary();gpsWatchId=navigator.geolocation.watchPosition(pos=>{const p={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy,speedKmh:pos.coords.speed==null?null:Math.max(0,pos.coords.speed*3.6),time:new Date(pos.timestamp).toISOString()};const t=state.activeTrip;if(!t)return;if(pos.coords.accuracy>50){gpsStatus='GPS accuracy poor — waiting for a better fix';renderTripDiary();return}if(!t.startLocation)t.startLocation=p;if(gpsLastPoint){const moved=haversineKm(gpsLastPoint,p);if(moved>=0.015&&moved<2){t.distanceKm+=moved}}if(p.speedKmh!=null&&p.speedKmh<160)t.maxSpeedKmh=Math.max(t.maxSpeedKmh,p.speedKmh);if(t.points.length<5000)t.points.push(p);gpsLastPoint=p;t.status='recording';gpsStatus='Recording';if(t.points.length%5===0)save();renderTripDiary()},err=>{gpsStatus=err.code===1?'Location permission denied':'GPS signal unavailable';toast(gpsStatus);renderTripDiary()},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});}
function resumeTrip(){if(!state.activeTrip||state.activeTrip.status!=='paused'){toast('No paused trip to resume');return}if(!navigator.geolocation||!window.isSecureContext){toast('GPS requires location permission and HTTPS');return}gpsLastPoint=state.activeTrip.points?.at(-1)||null;state.activeTrip.status='recording';gpsStatus='Recording';save();gpsWatchId=navigator.geolocation.watchPosition(pos=>{const p={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy,speedKmh:pos.coords.speed==null?null:Math.max(0,pos.coords.speed*3.6),time:new Date(pos.timestamp).toISOString()};const t=state.activeTrip;if(!t)return;if(!t.startLocation)t.startLocation=p;if(gpsLastPoint){const moved=haversineKm(gpsLastPoint,p);if(moved<2&&pos.coords.accuracy<=100)t.distanceKm+=moved}if(p.speedKmh!=null)t.maxSpeedKmh=Math.max(t.maxSpeedKmh,p.speedKmh);if(t.points.length<20000)t.points.push(p);gpsLastPoint=p;gpsStatus='Recording';save();renderTripDiary()},err=>{gpsStatus=err.code===1?'Location permission denied':'GPS signal unavailable';toast(gpsStatus);renderTripDiary()},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});renderTripDiary()}

function saveMaintenance(){const amount=Math.max(0,num(ma.value));if(amount<=0){toast('Enter a maintenance amount');return}state.maintenance.push({id:id(),vehicleId:num(mv.value),date:md.value||today(),amount,category:mc.value,odo:Math.max(0,num(mo.value)),next:Math.max(0,num(mn.value)),description:mdesc.value.trim()});save();closeModal();go('expenses');toast('Maintenance saved')}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function setReportPeriod(period){const now=new Date(),end=new Date(now),start=new Date(now);if(period==='week'){const day=(now.getDay()+6)%7;start.setDate(now.getDate()-day)}else if(period==='month'){start.setDate(1)}else if(period==='quarter'){start.setMonth(Math.floor(now.getMonth()/3)*3,1)}else if(period==='year'){start.setMonth(0,1)}const a=document.getElementById('reportFrom'),b=document.getElementById('reportTo');if(a&&b){a.value=isoDate(start);b.value=isoDate(end);const s=document.getElementById('reportVehicle');if(s)s.innerHTML='<option value="all">All trucks</option>'+state.vehicles.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join('');renderReport()}}
function reportData(){const from=document.getElementById('reportFrom')?.value||'0000-01-01',to=document.getElementById('reportTo')?.value||'9999-12-31',vehicle=document.getElementById('reportVehicle')?.value||'all';const match=x=>x.date>=from&&x.date<=to&&(vehicle==='all'||String(x.vehicleId)===vehicle);const jobs=state.jobs.filter(match),expenses=state.expenses.filter(match),maintenance=state.maintenance.filter(match);const days=Math.max(1,(new Date(to+'T00:00:00')-new Date(from+'T00:00:00'))/86400000+1);const fixedFactor=days/365.25;const jobRevenue=jobs.reduce((s,j)=>s+num(j.revenue),0),jobCosts=jobs.reduce((s,j)=>s+jobFuel(j)+num(j.tolls)+num(j.driver)+num(j.other),0),jobProfitTotal=jobRevenue-jobCosts,expenseTotal=expenses.reduce((s,e)=>s+num(e.amount),0),maintenanceTotal=maintenance.reduce((s,e)=>s+num(e.amount),0);const trucks=(vehicle==='all'?state.vehicles:state.vehicles.filter(v=>String(v.id)===vehicle)).map(v=>{const vJobs=jobs.filter(x=>x.vehicleId==v.id),vExpenses=expenses.filter(x=>x.vehicleId==v.id),vMaint=maintenance.filter(x=>x.vehicleId==v.id),revenue=vJobs.reduce((s,j)=>s+num(j.revenue),0),costs=vJobs.reduce((s,j)=>s+jobFuel(j)+num(j.tolls)+num(j.driver)+num(j.other),0),spend=vExpenses.reduce((s,e)=>s+num(e.amount),0),maint=vMaint.reduce((s,e)=>s+num(e.amount),0),fixed=annualFixed(v)*fixedFactor;return{vehicle:v,revenue,jobCosts:costs,jobProfit:revenue-costs,expenses:spend,maintenance:maint,fixed,jobs:vJobs.length}});return{from,to,days,jobs,expenses,maintenance,jobRevenue,jobCosts,jobProfit:jobProfitTotal,expenseTotal,maintenanceTotal,fixed:trucks.reduce((s,x)=>s+x.fixed,0),trucks}}
function renderReport(){const out=document.getElementById('reportOutput');if(!out)return;const r=reportData();if(r.from>r.to){out.innerHTML='<p class="bad">The start date must be before the end date.</p>';return}out.innerHTML=`<div class="section-title">Report: ${esc(r.from)} to ${esc(r.to)}</div><div class="grid"><div class="card"><div class="small muted">Job revenue</div><div class="metric">${money(r.jobRevenue)}</div><div class="small muted">${r.jobs.length} jobs</div></div><div class="card"><div class="small muted">Estimated job profit</div><div class="metric ${r.jobProfit>=0?'good':'bad'}">${money(r.jobProfit)}</div><div class="small muted">After estimated job costs</div></div><div class="card"><div class="small muted">Recorded expenses</div><div class="metric">${money(r.expenseTotal)}</div></div><div class="card"><div class="small muted">Recorded maintenance</div><div class="metric">${money(r.maintenanceTotal)}</div></div></div><div class="card"><b>Fixed cost allocation</b><div class="metric">${money(r.fixed)}</div><div class="small muted">Prorated finance, insurance and registration across ${r.days} calendar days.</div></div><p class="small muted">Important: estimated job costs and recorded expenses are shown separately. They may include the same fuel or other costs, so do not add these sections together as a net profit figure.</p><div class="section-title">Truck-by-truck</div>${r.trucks.length?r.trucks.map(x=>`<div class="card"><b>${esc(x.vehicle.name)}</b><div class="tableline"><span>Jobs / revenue</span><b>${x.jobs} · ${money(x.revenue)}</b></div><div class="tableline"><span>Estimated job costs</span><b>${money(x.jobCosts)}</b></div><div class="tableline"><span>Estimated job profit</span><b class="${x.jobProfit>=0?'good':'bad'}">${money(x.jobProfit)}</b></div><div class="tableline"><span>Recorded expenses</span><b>${money(x.expenses)}</b></div><div class="tableline"><span>Recorded maintenance</span><b>${money(x.maintenance)}</b></div><div class="tableline"><span>Allocated fixed costs</span><b>${money(x.fixed)}</b></div></div>`).join(''):'<p class="muted">No trucks match this report.</p>'}`;}
function exportReportCsv(){const r=reportData();if(r.from>r.to){toast('Check report dates');return}const rows=[['TruckCost AU report',r.from,r.to],['Record type','Date','Truck','Description','Revenue','Amount','Estimated job profit']];r.jobs.forEach(j=>rows.push(['Job',j.date,veh(j.vehicleId)?.name||'',j.name,num(j.revenue),jobFuel(j)+num(j.tolls)+num(j.driver)+num(j.other),jobProfit(j)]));r.expenses.forEach(e=>rows.push(['Expense',e.date,veh(e.vehicleId)?.name||'',e.description||e.category,'',num(e.amount),'']));r.maintenance.forEach(m=>rows.push(['Maintenance',m.date,veh(m.vehicleId)?.name||'',m.description||m.category,'',num(m.amount),'']));const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`truckcost-au-report-${r.from}-to-${r.to}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Report CSV exported')}
function receiptModal(){openModal('Receipt review',`<p class="muted small">This is a manual review workflow. No external OCR or accounting service is connected.</p><div class="field"><label>Receipt image</label><input id="ri" type="file" accept="image/*" capture="environment" onchange="previewReceipt(event)"></div><div id="rpreview" class="card hidden"></div><div class="two"><div class="field"><label>Supplier</label><input id="rs"></div><div class="field"><label>Date</label><input id="rd" type="date" value="${today()}"></div></div><div class="two"><div class="field"><label>Total amount</label><input id="ra" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>GST</label><input id="rg" type="number" min="0" step="0.01" value="0"></div></div><div class="two"><div class="field"><label>Category</label><select id="rc"><option>Fuel</option><option>Tyres</option><option>Repairs</option><option>Parts</option><option>Maintenance</option><option>Insurance</option><option>Registration</option><option>Tolls</option><option>Other</option></select></div><div class="field"><label>Vehicle</label><select id="rv">${vehicleOptions(state.vehicles[0]?.id)}</select></div></div><div class="field"><label>Description</label><input id="rx"></div><button class="btn" style="width:100%" onclick="saveReceiptExpense()">Review & save expense</button>`)}
function previewReceipt(e){const f=e.target.files?.[0];if(!f)return;const p=document.getElementById('rpreview');p.classList.remove('hidden');p.innerHTML=`<div class="small muted">Receipt selected</div><b>${esc(f.name)}</b><div class="small muted">${Math.round(f.size/1024)} KB · manual review required</div>`}
function saveReceiptExpense(){const amount=Math.max(0,num(ra.value));if(amount<=0){toast('Enter or confirm the receipt total');return}state.expenses.push({id:id(),vehicleId:num(rv.value),date:rd.value||today(),amount,category:rc.value,description:`${rs.value.trim()||'Receipt'}${rx.value.trim()?' — '+rx.value.trim():''}`,gst:Math.max(0,num(rg.value)),source:'receipt'});save();closeModal();go('expenses');toast('Receipt saved as expense')}
function exportData(){const payload=JSON.stringify({...state,schemaVersion:1},null,2);const blob=new Blob([payload],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`truckcost-au-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported')}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const imported=normalise(JSON.parse(r.result));if(!confirm('Replace this browser workspace with the selected backup?'))return;state=imported;save();showApp();toast('Backup restored')}catch{toast('Invalid backup file')}};r.readAsText(f);e.target.value=''}
function resetData(){if(confirm('Reset this browser workspace to empty data?')){state=emptyState();save();location.reload()}}
function signOut(){state.user=null;save();location.reload()}
</script>
</body></html>
