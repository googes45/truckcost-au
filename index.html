<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418"><meta name="description" content="Truck operating costs and job profitability">
<title>TruckCost AU</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0c1014;--panel:#151b21;--panel2:#1b232b;--text:#f2f5f7;--muted:#9aa6b2;--line:#2a343e;--accent:#ffb000;--good:#42d392;--bad:#ff6b6b;--r:16px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0f13,#11171d);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px}.top{position:sticky;top:0;z-index:5;background:rgba(12,16,20,.94);backdrop-filter:blur(12px);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand span{color:var(--accent)}.status{font-size:11px;color:var(--accent);border:1px solid #6b5010;padding:5px 8px;border-radius:99px}.page{padding:16px}.hero{padding:20px 0 10px}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px}.hero h1{font-size:30px;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}.metric{font-size:29px;font-weight:900;margin:5px 0}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#111;font-weight:850}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.good{background:var(--good)}.btn.danger{background:#3a2022;color:#ff9b9b;border:1px solid #653337}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-title{font-weight:900;font-size:17px;margin:18px 0 9px}.item{padding:12px 0;border-top:1px solid var(--line)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:11px}.good{color:var(--good)}.bad{color:var(--bad)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#10161b;border-top:1px solid var(--line);z-index:9}.nav button{background:none;border:0;color:var(--muted);padding:10px 3px;font-size:11px}.nav button.active{color:var(--accent)}.nav b{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(520px,100%);margin:auto 0 0;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:18px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;background:#0f1419;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.close{background:none;border:0;color:var(--muted);font-size:24px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:#e9eef2;color:#101418;padding:11px 15px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bar{height:9px;background:#263039;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px}.logo{font-size:27px;font-weight:950;margin-bottom:18px}.logo span{color:var(--accent)}.hidden{display:none!important}.tableline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
</style>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="logo">TruckCost <span>AU</span></div><div class="eyebrow">Know what your truck really costs.</div><h2>Local beta</h2><p class="muted">This release stores data only in this browser. There is no real account, cloud sync or secure authentication yet.</p><div class="field"><label>Operator email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><button class="btn" style="width:100%" onclick="startLocal()">Enter local workspace</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="createDemo()">Load demo workspace</button><p class="small muted" style="margin-top:15px">Do not use this local beta as the system of record for confidential business data.</p></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">TruckCost <span>AU</span></div><div class="status">● LOCAL BETA</div></header><main id="content" class="page"></main><nav class="nav"><button data-tab="home" onclick="go('home')"><b>⌂</b>Dashboard</button><button data-tab="jobs" onclick="go('jobs')"><b>▣</b>Jobs</button><button data-tab="expenses" onclick="go('expenses')"><b>＋</b>Costs</button><button data-tab="vehicles" onclick="go('vehicles')"><b>🚛</b>Trucks</button><button data-tab="more" onclick="go('more')"><b>☰</b>More</button></nav></div>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h2 id="modalTitle" style="margin:0">Add</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='truckcost_au_v1';
const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Number.isFinite(Number(n))?Number(n):0);
const num=n=>{const v=Number(n);return Number.isFinite(v)?v:0};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));
const id=()=>Date.now()+Math.floor(Math.random()*1000);
function emptyState(){return{schemaVersion:1,user:null,vehicles:[],jobs:[],expenses:[],maintenance:[]}}
function demoState(){return{schemaVersion:1,user:{email:'demo@truckcost.au',name:'Demo Operator'},vehicles:[{id:1,name:'Workhorse',make:'Kenworth',model:'T610',year:2016,rego:'123-ABC',odo:684200,initialOdo:640000,fuelKmL:2.45,fuelPrice:2.15,finance:2100,insurance:420,regoCost:180}],jobs:[{id:1,vehicleId:1,name:'Brisbane → Mackay',date:today(),revenue:4800,distance:1420,fuel:2.4,fuelPrice:2.15,tolls:145,driver:620,other:0}],expenses:[{id:1,vehicleId:1,date:today(),category:'Tyres',amount:1850,odo:682100,description:'Drive tyres'}],maintenance:[{id:1,vehicleId:1,date:today(),category:'Service',amount:980,odo:680000,description:'Engine service'}]}}
function normalise(s){if(!s||typeof s!=='object')return emptyState();return Object.assign(emptyState(),s,{schemaVersion:1,vehicles:Array.isArray(s.vehicles)?s.vehicles:[],jobs:Array.isArray(s.jobs)?s.jobs:[],expenses:Array.isArray(s.expenses)?s.expenses:[],maintenance:Array.isArray(s.maintenance)?s.maintenance:[]})}
let state=normalise(JSON.parse(localStorage.getItem(KEY)||'null'));let tab='home';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function startLocal(){const email=document.getElementById('email').value.trim();state.user={email:email||'Local operator',name:'Local Operator'};save();showApp();toast('Local workspace ready')}
function createDemo(){state=demoState();save();showApp();toast('Demo workspace loaded')}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');go('home')}
function boot(){if(state.user)showApp()}boot();
function veh(x){return state.vehicles.find(v=>v.id==x)}
function recordedKm(v){return Math.max(0,num(v.odo)-num(v.initialOdo))}
function annualFixed(v){return num(v.finance)*12+num(v.insurance)*12+num(v.regoCost)}
function vehicleCostPerKm(v){if(!v)return 0;const km=Math.max(1,recordedKm(v));const direct=state.expenses.filter(e=>e.vehicleId==v.id).reduce((a,e)=>a+num(e.amount),0)+state.maintenance.filter(e=>e.vehicleId==v.id).reduce((a,e)=>a+num(e.amount),0);return (direct+annualFixed(v))/km}
function jobFuel(j){return num(j.distance)/Math.max(.1,num(j.fuel))*num(j.fuelPrice)}
function jobProfit(j){return num(j.revenue)-jobFuel(j)-num(j.tolls)-num(j.driver)-num(j.other)}
function render(){const c=document.getElementById('content');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home:dashboard,jobs:jobsPage,expenses:expensesPage,vehicles:vehiclesPage,more:morePage}[tab])(c)}
function go(t){tab=t;render()}
function dashboard(c){const revenue=state.jobs.reduce((a,j)=>a+num(j.revenue),0);const direct=state.expenses.reduce((a,e)=>a+num(e.amount),0)+state.maintenance.reduce((a,e)=>a+num(e.amount),0);const jobFuel=state.jobs.reduce((a,j)=>a+jobFuelCost(j),0);const km=state.vehicles.reduce((a,v)=>a+recordedKm(v),0);const fixed=state.vehicles.reduce((a,v)=>a+annualFixed(v),0);const cost=(direct+jobFuel+fixed)/Math.max(1,km);const position=revenue-direct-jobFuel-fixed;c.innerHTML=`<div class="hero"><div class="eyebrow">${esc(state.user?.email||'Local operator')}</div><h1>Good morning.</h1><p class="muted">Fleet economics at a glance.</p></div><div class="grid"><div class="card"><div class="small muted">Estimated full cost / km</div><div class="metric">${money(cost)}</div><div class="small muted">Includes recorded fixed costs</div></div><div class="card"><div class="small muted">Job revenue</div><div class="metric">${money(revenue)}</div><div class="small good">${state.jobs.length} jobs</div></div></div><div class="card"><div class="row"><b>Estimated operating position</b><span class="pill">BETA</span></div><div class="tableline"><span>Fuel from jobs</span><b>${money(jobFuel)}</b></div><div class="tableline"><span>Recorded direct costs</span><b>${money(direct)}</b></div><div class="tableline"><span>Annual fixed costs allocated</span><b>${money(fixed)}</b></div><div class="tableline"><span>Revenue less listed costs</span><b class="${position>=0?'good':'bad'}">${money(position)}</b></div></div><div class="section-title">Quick actions</div><div class="actions"><button class="btn" onclick="jobModal()">＋ New Job</button><button class="btn secondary" onclick="expenseModal()">＋ Expense</button><button class="btn secondary" onclick="fuelModal()">⛽ Fuel</button><button class="btn secondary" onclick="maintenanceModal()">🔧 Maintenance</button><button class="btn secondary" onclick="vehicleModal()">🚛 Add Truck</button></div><div class="section-title">Fleet</div>${state.vehicles.length?state.vehicles.map(v=>`<div class="card"><div class="row"><div><b>${esc(v.name)}</b><div class="small muted">${esc(v.make)} ${esc(v.model)} · ${esc(v.rego||'No rego')}</div></div><b>${money(vehicleCostPerKm(v))}/km</b></div><div class="bar"><i style="width:${Math.min(100,Math.max(8,vehicleCostPerKm(v)*100))}%"></i></div></div>`).join(''):'<p class="muted">Add your first truck to begin.</p>'}`}
function jobFuelCost(j){return jobFuel(j)}
function jobsPage(c){c.innerHTML=`<div class="hero"><div class="eyebrow">Profitability</div><h1>Jobs</h1><p class="muted">Estimate margin before accepting freight.</p></div><button class="btn" onclick="jobModal()">＋ Calculate new job</button><div class="section-title">Saved jobs</div>${state.jobs.length?state.jobs.slice().reverse().map(j=>{const p=jobProfit(j),m=p/Math.max(1,num(j.revenue))*100;return `<div class="card"><div class="row"><div><b>${esc(j.name)}</b><div class="small muted">${esc(j.date)} · ${num(j.distance).toLocaleString()} km</div></div><b class="${p>=0?'good':'bad'}">${money(p)}</b></div><div class="small muted" style="margin-top:7px">Margin ${m.toFixed(1)}% · Fuel ${money(jobFuel(j))} · Profit/km ${money(p/Math.max(1,num(j.distance)))}</div></div>`}).join(''):'<p class="muted">No jobs yet.</p>'}`}
function expensesPage(c){const cats={};state.expenses.forEach(e=>cats[e.category]=(cats[e.category]||0)+num(e.amount));state.maintenance.forEach(e=>cats['Maintenance']=(cats['Maintenance']||0)+num(e.amount));c.innerHTML=`<div class="hero"><div class="eyebrow">Costs</div><h1>Expenses</h1><p class="muted">Record every direct operating cost.</p></div><div class="actions"><button class="btn" onclick="expenseModal()">＋ Expense</button><button class="btn secondary" onclick="fuelModal()">⛽ Fuel</button><button class="btn secondary" onclick="maintenanceModal()">🔧 Maintenance</button><button class="btn secondary" onclick="receiptModal()">📷 Receipt</button></div><div class="section-title">Breakdown</div>${Object.keys(cats).length?Object.entries(cats).map(([k,v])=>`<div class="card"><div class="row"><span>${esc(k)}</span><b>${money(v)}</b></div></div>`).join(''):'<p class="muted">No expenses yet.</p>'}<div class="section-title">Recent expenses</div>${state.expenses.slice().reverse().map(e=>`<div class="item"><div class="row"><div><b>${esc(e.category)}</b><div class="small muted">${esc(veh(e.vehicleId)?.name||'')} · ${esc(e.date)}</div></div><b>${money(e.amount)}</b></div><div class="small muted">${esc(e.description||'')}</div></div>`).join('')}`}
function vehiclesPage(c){c.innerHTML=`<div class="hero"><div class="eyebrow">Fleet</div><h1>Your trucks</h1><p class="muted">Vehicle-specific economics and records.</p></div><button class="btn" onclick="vehicleModal()">＋ Add vehicle</button><div class="section-title">Vehicles</div>${state.vehicles.length?state.vehicles.map(v=>`<div class="card"><div class="row"><div><b>${esc(v.name)}</b><div class="small muted">${esc(v.year||'')} ${esc(v.make)} ${esc(v.model)}</div><div class="small muted">${esc(v.rego||'Unregistered')} · Odo ${recordedKm(v).toLocaleString()} km recorded</div></div><b>${money(vehicleCostPerKm(v))}/km</b></div><div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="vehicleModal(${v.id})">Edit</button><button class="btn secondary" onclick="fuelModal(${v.id})">Add fuel</button></div></div>`).join(''):'<p class="muted">No vehicles yet.</p>'}`}
function morePage(c){c.innerHTML=`<div class="hero"><div class="eyebrow">Account & data</div><h1>More</h1><p class="muted">${esc(state.user?.email||'')}</p></div><div class="card"><b>Local beta status</b><p class="muted">Data is stored in this browser only. This build deliberately does not pretend to provide cloud authentication or synchronisation.</p><span class="pill">LOCAL ONLY</span></div><div class="section-title">Backups</div><div class="actions"><button class="btn secondary" onclick="exportData()">Export backup</button><button class="btn secondary" onclick="document.getElementById('import').click()">Restore backup</button><button class="btn danger" onclick="resetData()">Reset data</button></div><input id="import" type="file" accept="application/json" class="hidden" onchange="importData(event)"><div class="section-title">Receipt workflow</div><div class="card"><p class="muted">Receipt capture is a review workflow only. No OCR service is connected in this release.</p><button class="btn secondary" onclick="receiptModal()">Open receipt capture</button></div><div class="section-title">Production blockers</div><div class="card"><div class="item">🔐 Real authentication and server-side authorisation</div><div class="item">☁️ Secure cloud database and multi-device sync</div><div class="item">🧪 Automated calculation tests and CI</div><div class="item">🧾 Verified OCR/accounting integration</div><div class="item">👥 Roles, audit logs and business-data controls</div></div><button class="btn secondary" onclick="signOut()">Sign out</button>`}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function vehicleOptions(selected){return state.vehicles.map(v=>`<option value="${v.id}" ${v.id==selected?'selected':''}>${esc(v.name)} — ${esc(v.make)} ${esc(v.model)}</option>`).join('')}
function vehicleModal(vehicleId){const v=vehicleId?veh(vehicleId):{};openModal(vehicleId?'Edit vehicle':'Add vehicle',`<div class="two"><div class="field"><label>Truck name</label><input id="vn" value="${esc(v.name||'')}"></div><div class="field"><label>Registration</label><input id="vr" value="${esc(v.rego||'')}"></div></div><div class="two"><div class="field"><label>Make</label><input id="vm" value="${esc(v.make||'')}"></div><div class="field"><label>Model</label><input id="vmo" value="${esc(v.model||'')}"></div></div><div class="two"><div class="field"><label>Year</label><input id="vy" type="number" value="${v.year||''}"></div><div class="field"><label>Current odometer</label><input id="vo" type="number" value="${v.odo||''}"></div></div><div class="two"><div class="field"><label>Initial odometer</label><input id="vio" type="number" value="${v.initialOdo||''}"></div><div class="field"><label>Fuel economy km/L</label><input id="vf" type="number" step="0.01" value="${v.fuelKmL||2.4}"></div></div><div class="two"><div class="field"><label>Finance / month</label><input id="vfin" type="number" value="${v.finance||0}"></div><div class="field"><label>Insurance / month</label><input id="vi" type="number" value="${v.insurance||0}"></div></div><div class="two"><div class="field"><label>Registration / year</label><input id="vreg" type="number" value="${v.regoCost||0}"></div><div class="field"><label>Fuel price / L</label><input id="vfp" type="number" step="0.001" value="${v.fuelPrice||2.15}"></div></div><button class="btn" style="width:100%" onclick="saveVehicle(${vehicleId||0})">Save vehicle</button>`)}
function saveVehicle(vehicleId){const v=vehicleId?veh(vehicleId):{id:id()};Object.assign(v,{name:vn.value.trim(),rego:vr.value.trim(),make:vm.value.trim(),model:vmo.value.trim(),year:num(vy.value),odo:num(vo.value),initialOdo:num(vio.value),fuelKmL:num(vf.value),finance:num(vfin.value),insurance:num(vi.value),regoCost:num(vreg.value),fuelPrice:num(vfp.value)});if(!v.name){toast('Truck name is required');return}if(!vehicleId)state.vehicles.push(v);save();closeModal();render();toast('Vehicle saved')}
function jobModal(){if(!state.vehicles.length){toast('Add a truck first');return}openModal('New job profitability',`<div class="field"><label>Vehicle</label><select id="jv">${vehicleOptions(state.vehicles[0].id)}</select></div><div class="field"><label>Job name</label><input id="jn" value="New freight job"></div><div class="two"><div class="field"><label>Revenue</label><input id="jr" type="number" min="0" value="4800" oninput="calcJob()"></div><div class="field"><label>Distance km</label><input id="jd" type="number" min="0" value="1420" oninput="calcJob()"></div></div><div class="two"><div class="field"><label>Fuel economy km/L</label><input id="jf" type="number" min="0.1" step="0.01" value="2.4" oninput="calcJob()"></div><div class="field"><label>Fuel price / L</label><input id="jfp" type="number" min="0" step="0.001" value="2.15" oninput="calcJob()"></div></div><div class="two"><div class="field"><label>Tolls</label><input id="jt" type="number" min="0" value="145" oninput="calcJob()"></div><div class="field"><label>Driver cost</label><input id="jdr" type="number" min="0" value="620" oninput="calcJob()"></div></div><div class="field"><label>Other job costs</label><input id="jo" type="number" min="0" value="0" oninput="calcJob()"></div><div class="card"><div class="small muted">Estimated profit</div><div class="metric" id="jp">$0</div><div id="jm" class="good">0.0% margin · $0/km</div></div><button class="btn good" style="width:100%" onclick="saveJob()">Save job</button>`);calcJob()}
function calcJob(){const rev=Math.max(0,num(jr.value)),d=Math.max(0,num(jd.value)),fuel=d/Math.max(.1,num(jf.value))*Math.max(0,num(jfp.value)),p=rev-fuel-Math.max(0,num(jt.value))-Math.max(0,num(jdr.value))-Math.max(0,num(jo.value)),m=p/Math.max(1,rev)*100;document.getElementById('jp').textContent=money(p);document.getElementById('jm').textContent=`${m.toFixed(1)}% margin · ${money(p/Math.max(1,d))}/km`;document.getElementById('jm').className=p>=0?'good':'bad'}
function saveJob(){const d=Math.max(0,num(jd.value)),rev=Math.max(0,num(jr.value));if(!jn.value.trim()||d<=0||rev<=0){toast('Enter a job name, revenue and distance');return}state.jobs.push({id:id(),vehicleId:num(jv.value),name:jn.value.trim(),date:today(),revenue:rev,distance:d,fuel:Math.max(.1,num(jf.value)),fuelPrice:Math.max(0,num(jfp.value)),tolls:Math.max(0,num(jt.value)),driver:Math.max(0,num(jdr.value)),other:Math.max(0,num(jo.value))});save();closeModal();go('jobs');toast('Job saved')}
function expenseModal(){if(!state.vehicles.length){toast('Add a truck first');return}openModal('Add expense',`<div class="field"><label>Vehicle</label><select id="ev">${vehicleOptions(state.vehicles[0].id)}</select></div><div class="two"><div class="field"><label>Date</label><input id="ed" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input id="ea" type="number" min="0" step="0.01" value="0"></div></div><div class="field"><label>Category</label><select id="ec"><option>Fuel</option><option>Tyres</option><option>Repairs</option><option>Parts</option><option>Insurance</option><option>Registration</option><option>Tolls</option><option>Other</option></select></div><div class="field"><label>Odometer</label><input id="eo" type="number" min="0"></div><div class="field"><label>Description</label><input id="edesc"></div><button class="btn" style="width:100%" onclick="saveExpense()">Save expense</button>`)}
function saveExpense(){const amount=Math.max(0,num(ea.value));if(amount<=0){toast('Enter an expense amount');return}state.expenses.push({id:id(),vehicleId:num(ev.value),date:ed.value||today(),amount,category:ec.value,odo:Math.max(0,num(eo.value)),description:edesc.value.trim()});save();closeModal();go('expenses');toast('Expense saved')}
function fuelModal(vehicleId){if(!state.vehicles.length){toast('Add a truck first');return}openModal('Record fuel',`<div class="field"><label>Vehicle</label><select id="fv">${vehicleOptions(vehicleId||state.vehicles[0].id)}</select></div><div class="two"><div class="field"><label>Litres</label><input id="fl" type="number" min="0" step="0.1" value="500" oninput="fuelTotal()"></div><div class="field"><label>Price / L</label><input id="fp" type="number" min="0" step="0.001" value="2.15" oninput="fuelTotal()"></div></div><div id="ft" class="card"></div><div class="two"><div class="field"><label>Date</label><input id="fd" type="date" value="${today()}"></div><div class="field"><label>Odometer</label><input id="fo" type="number" min="0"></div></div><div class="field"><label>Station / note</label><input id="fs"></div><button class="btn" style="width:100%" onclick="saveFuel()">Save fuel</button>`);fuelTotal()}
function fuelTotal(){document.getElementById('ft').innerHTML=`<b>Total ${money(Math.max(0,num(fl.value))*Math.max(0,num(fp.value)))}</b>`}
function saveFuel(){const amount=Math.max(0,num(fl.value))*Math.max(0,num(fp.value));if(amount<=0){toast('Enter litres and price');return}state.expenses.push({id:id(),vehicleId:num(fv.value),date:fd.value||today(),amount,category:'Fuel',odo:Math.max(0,num(fo.value)),description:fs.value.trim()||'Fuel purchase'});save();closeModal();go('expenses');toast('Fuel purchase saved')}
function maintenanceModal(){if(!state.vehicles.length){toast('Add a truck first');return}openModal('Add maintenance',`<div class="field"><label>Vehicle</label><select id="mv">${vehicleOptions(state.vehicles[0].id)}</select></div><div class="two"><div class="field"><label>Date</label><input id="md" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input id="ma" type="number" min="0" value="0"></div></div><div class="field"><label>Type</label><select id="mc"><option>Service</option><option>Repair</option><option>Electrical</option><option>Brakes</option><option>Cooling</option><option>Other</option></select></div><div class="two"><div class="field"><label>Odometer</label><input id="mo" type="number" min="0"></div><div class="field"><label>Next due km</label><input id="mn" type="number" min="0"></div></div><div class="field"><label>Description</label><input id="mdesc"></div><button class="btn" style="width:100%" onclick="saveMaintenance()">Save maintenance</button>`)}
function saveMaintenance(){const amount=Math.max(0,num(ma.value));if(amount<=0){toast('Enter a maintenance amount');return}state.maintenance.push({id:id(),vehicleId:num(mv.value),date:md.value||today(),amount,category:mc.value,odo:Math.max(0,num(mo.value)),next:Math.max(0,num(mn.value)),description:mdesc.value.trim()});save();closeModal();go('expenses');toast('Maintenance saved')}
function receiptModal(){openModal('Receipt review',`<p class="muted small">This is a manual review workflow. No external OCR or accounting service is connected.</p><div class="field"><label>Receipt image</label><input id="ri" type="file" accept="image/*" capture="environment" onchange="previewReceipt(event)"></div><div id="rpreview" class="card hidden"></div><div class="two"><div class="field"><label>Supplier</label><input id="rs"></div><div class="field"><label>Date</label><input id="rd" type="date" value="${today()}"></div></div><div class="two"><div class="field"><label>Total amount</label><input id="ra" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>GST</label><input id="rg" type="number" min="0" step="0.01" value="0"></div></div><div class="two"><div class="field"><label>Category</label><select id="rc"><option>Fuel</option><option>Tyres</option><option>Repairs</option><option>Parts</option><option>Maintenance</option><option>Insurance</option><option>Registration</option><option>Tolls</option><option>Other</option></select></div><div class="field"><label>Vehicle</label><select id="rv">${vehicleOptions(state.vehicles[0]?.id)}</select></div></div><div class="field"><label>Description</label><input id="rx"></div><button class="btn" style="width:100%" onclick="saveReceiptExpense()">Review & save expense</button>`)}
function previewReceipt(e){const f=e.target.files?.[0];if(!f)return;const p=document.getElementById('rpreview');p.classList.remove('hidden');p.innerHTML=`<div class="small muted">Receipt selected</div><b>${esc(f.name)}</b><div class="small muted">${Math.round(f.size/1024)} KB · manual review required</div>`}
function saveReceiptExpense(){const amount=Math.max(0,num(ra.value));if(amount<=0){toast('Enter or confirm the receipt total');return}state.expenses.push({id:id(),vehicleId:num(rv.value),date:rd.value||today(),amount,category:rc.value,description:`${rs.value.trim()||'Receipt'}${rx.value.trim()?' — '+rx.value.trim():''}`,gst:Math.max(0,num(rg.value)),source:'receipt'});save();closeModal();go('expenses');toast('Receipt saved as expense')}
function exportData(){const payload=JSON.stringify({...state,schemaVersion:1},null,2);const blob=new Blob([payload],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`truckcost-au-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported')}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const imported=normalise(JSON.parse(r.result));if(!confirm('Replace this browser workspace with the selected backup?'))return;state=imported;save();showApp();toast('Backup restored')}catch{toast('Invalid backup file')}};r.readAsText(f);e.target.value=''}
function resetData(){if(confirm('Reset this browser workspace to empty data?')){state=emptyState();save();location.reload()}}
function signOut(){state.user=null;save();location.reload()}
</script>
</body></html>
